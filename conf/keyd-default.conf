[ids]
*

# ---------------------------------------------------------------------------
# Super (the Windows key) now behaves like macOS Cmd.
#
# THE IMPORTANT BIT: clipboard uses the XF86Copy / XF86Paste / XF86Cut MEDIA
# keys instead of Ctrl+C / Ctrl+V / Ctrl+X. GTK and Qt apps handle those
# natively, and because Ctrl+C is never actually sent, it keeps working as
# SIGINT in every terminal. That is what fixes your Ctrl+Shift+C problem.
#
# Super+L is deliberately NOT remapped - it stays as the lock screen.
# ---------------------------------------------------------------------------
[meta]
c = copy
v = paste
x = cut

a = C-a
z = C-z
s = C-s
f = C-f
o = C-o
p = C-p
n = C-n
t = C-t
w = C-w
r = C-r
b = C-b
i = C-i
u = C-u
g = C-g
k = C-k
j = C-j
d = C-d
e = C-e
y = C-y
comma = C-comma
minus = C-minus
equal = C-equal
0 = C-0

# macOS text navigation: Cmd+Left/Right = start/end of line
left = home
right = end
up = C-home
down = C-end
backspace = C-backspace

[meta+shift]
v = M-S-v
z = C-S-z
t = C-S-t
n = C-S-n
f = C-S-f
g = C-S-g
# NOTE: Shift+Super+V is deliberately left alone so Pano (clipboard
# history) keeps working on that shortcut. macOS "paste and match
# style" is sacrificed for it - clipboard history is more useful.
left = S-home
right = S-end
up = C-S-home
down = C-S-end
