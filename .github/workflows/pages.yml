name: Pages
on:
  push:
    branches: [master, main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}

jobs:
  deploy:
    # GitHub Pages is not available for private repos on the free plan, so the
    # job would fail rather than skip. Gate it on visibility: while the repo is
    # private this is reported as "skipped", and it starts deploying by itself
    # the moment the repo is made public. A manual run is always allowed.
    if: github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # self-enable Pages on the first public run, so no manual
          # Settings -> Pages step is needed
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v4
